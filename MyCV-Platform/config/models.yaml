# Copy Version Enhanced Features
copy_version:
  enabled: true
  structured_output: true
  subfolder_organization: true
  compare_visualization: true
  brightness_preservation: true
  
  # Output directory structure
  output_structure:
    base_path: "./direct/data/output/remote"
    subfolders:
      - "yolo"
      - "best" 
      - "segmentasi"
      - "hybrid"
    
  # File naming convention
  naming_convention:
    detection: "(image_name)-(model_name)-detection.png"
    best: "(image_name)-(model_name)-best.png"
    segmentation: "(image_name)-(model_name)-segmentation.png"
    hybrid: "(image_name)-(model_name)-hybrid.png"
    compare: "(image_name)-(model_name)-compare.png"
    json: "(image_name)-(model_name)-detection.json"
    
  # JSON output configuration
  json_output:
    best_pt_only: true
    yolo11m_disabled: true
    include_confidence: true
    include_bbox: true
    include_masks: true

# Model management settings
settings:
  auto_download: true
  validate_checksums: true
  backup_old_models: true
  max_concurrent_downloads: 2
  download_timeout: 300
  retry_attempts: 3
  
# Storage paths
paths:
  # Direct execution paths
  direct:
    yolo_active: "./direct/data/models/yolo/active"
    yolo_downloads: "./direct/data/models/yolo/downloads"
    sam_active: "./direct/data/models/sam/active"
    sam_downloads: "./direct/data/models/sam/downloads"
    trained_active: "./direct/data/models/trained/active"
    trained_downloads: "./direct/data/models/trained/downloads"
    output: "./direct/data/output"
    input_test: "./direct/data/input/test_images"
    input_remote: "./direct/data/input/remote"
    logs: "./direct/logs"
    
  # Docker paths (legacy)
  docker:
    yolo_active: "/app/data/models/yolo/active"
    yolo_downloads: "/app/data/models/yolo/downloads"
    sam_active: "/app/data/models/sam/active"
    sam_downloads: "/app/data/models/sam/downloads"
    output: "/app/data/output"
    logs: "/app/logs"

# Script Launchers Configuration
launchers:
  run_direct:
    enabled: true
    script_path: "./run_direct.sh"
    documentation: "./README_run_direct.md"
    description: "Direct execution launcher"
    
  run_web:
    enabled: true
    script_path: "./run_web.sh"
    documentation: "./README_run_web.md"
    description: "Web application launcher"
    port: 5000
    host: "localhost"
    
  run_docker:
    enabled: true
    script_path: "./run_docker.sh"
    description: "Docker testing launcher"
    gpu_support: false
    cpu_only: true

# Web Application Configuration
web_app:
  enabled: true
  port: 5000
  host: "0.0.0.0"
  debug: true
  camera:
    default_index: 0
    auto_detect: true
    resolution: "auto"
    fps: "real-time"
  models:
    yolo: "yolo11m.pt"
    trained: "best.pt"
    sam: "sam2_b.pt"
  features:
    real_time_detection: true
    interactive_controls: true
    visualization_options: true
    performance_metrics: true
