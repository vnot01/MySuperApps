<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCV-Platform - Real-time Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .video-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .video-container h2 {
            margin-bottom: 15px;
            color: #333;
            text-align: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .controls h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #f44336, #da190b);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        .btn-info {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }

        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        .status {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .status h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            font-weight: 600;
            color: #555;
        }

        .status-value {
            color: #333;
        }

        .detection-results {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .detection-results h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .detection-item {
            background: white;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #4CAF50;
        }

        .detection-item h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .detection-item p {
            color: #666;
            font-size: 0.9em;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            display: none;
        }

        .success {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            display: none;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .video-wrapper {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 MyCV-Platform</h1>
            <p>Real-time Camera Detection with YOLO + SAM2</p>
        </div>

        <div class="main-content">
            <div class="video-container">
                <h2>📹 Live Camera Feed</h2>
                <div class="video-wrapper">
                    <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Video Feed">
                </div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Loading camera...</p>
                </div>
            </div>

            <div class="controls">
                <h2>🎮 Controls</h2>
                
                <div class="control-group">
                    <button id="start-btn" class="btn btn-primary">
                        ▶️ Start Detection
                    </button>
                    <button id="stop-btn" class="btn btn-danger" disabled>
                        ⏹️ Stop Detection
                    </button>
                    <button id="refresh-btn" class="btn btn-info">
                        🔄 Refresh Status
                    </button>
                </div>

                <div class="status">
                    <h3>📊 System Status</h3>
                    <div class="status-item">
                        <span class="status-label">Detection:</span>
                        <span class="status-value" id="detection-status">Stopped</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Camera:</span>
                        <span class="status-value" id="camera-status">Active</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Models:</span>
                        <span class="status-value" id="models-status">Loading...</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Device:</span>
                        <span class="status-value" id="device-status">Unknown</span>
                    </div>
                </div>

                <div class="detection-results">
                    <h3>🔍 Detection Results</h3>
                    <div id="results-container">
                        <p style="text-align: center; color: #999;">No detections yet</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="error" id="error-message"></div>
        <div class="success" id="success-message"></div>

        <div class="footer">
            <p>Powered by MyCV-Platform | YOLO + SAM2 Integration</p>
        </div>
    </div>

    <script>
        let isDetecting = false;
        let statusInterval;

        // DOM elements
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const detectionStatus = document.getElementById('detection-status');
        const resultsContainer = document.getElementById('results-container');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const loading = document.getElementById('loading');

        // Event listeners
        startBtn.addEventListener('click', startDetection);
        stopBtn.addEventListener('click', stopDetection);
        refreshBtn.addEventListener('click', refreshStatus);

        // Video feed error handling
        document.getElementById('video-feed').addEventListener('error', function() {
            showError('Failed to load camera feed. Please check if camera is connected.');
            loading.style.display = 'block';
        });

        document.getElementById('video-feed').addEventListener('load', function() {
            loading.style.display = 'none';
        });

        async function startDetection() {
            try {
                const response = await fetch('/start_detection', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (response.ok) {
                    isDetecting = true;
                    updateUI();
                    showSuccess('Detection started successfully!');
                    startStatusUpdates();
                } else {
                    showError('Failed to start detection');
                }
            } catch (error) {
                showError('Error starting detection: ' + error.message);
            }
        }

        async function stopDetection() {
            try {
                const response = await fetch('/stop_detection', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (response.ok) {
                    isDetecting = false;
                    updateUI();
                    showSuccess('Detection stopped');
                    stopStatusUpdates();
                } else {
                    showError('Failed to stop detection');
                }
            } catch (error) {
                showError('Error stopping detection: ' + error.message);
            }
        }

        async function refreshStatus() {
            try {
                const response = await fetch('/detection_status');
                const data = await response.json();
                
                isDetecting = data.is_detecting;
                updateUI();
                updateResults(data.results);
            } catch (error) {
                showError('Error refreshing status: ' + error.message);
            }
        }

        async function updateSystemStatus() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                
                document.getElementById('models-status').textContent = data.models_loaded + ' models loaded';
                document.getElementById('device-status').textContent = data.device.toUpperCase();
                document.getElementById('camera-status').textContent = data.camera_active ? 'Active' : 'Inactive';
            } catch (error) {
                console.error('Error updating system status:', error);
            }
        }

        function updateUI() {
            if (isDetecting) {
                startBtn.disabled = true;
                stopBtn.disabled = false;
                detectionStatus.textContent = 'Running';
                detectionStatus.style.color = '#4CAF50';
            } else {
                startBtn.disabled = false;
                stopBtn.disabled = true;
                detectionStatus.textContent = 'Stopped';
                detectionStatus.style.color = '#f44336';
            }
        }

        function updateResults(results) {
            if (!results || Object.keys(results).length === 0) {
                resultsContainer.innerHTML = '<p style="text-align: center; color: #999;">No detections yet</p>';
                return;
            }

            let html = '';
            
            if (results.yolo11m && results.yolo11m.length > 0) {
                html += '<div class="detection-item">';
                html += '<h4>🎯 YOLO11m Detections</h4>';
                results.yolo11m.forEach((detection, index) => {
                    html += `<p>${index + 1}. ${detection.class_name} (${(detection.confidence * 100).toFixed(1)}%)</p>`;
                });
                html += '</div>';
            }

            if (results.best_pt && results.best_pt.length > 0) {
                html += '<div class="detection-item">';
                html += '<h4>🎯 Best.pt Detections</h4>';
                results.best_pt.forEach((detection, index) => {
                    html += `<p>${index + 1}. ${detection.class_name} (${(detection.confidence * 100).toFixed(1)}%)</p>`;
                });
                html += '</div>';
            }

            if (results.yolo11m_masks > 0 || results.best_pt_masks > 0) {
                html += '<div class="detection-item">';
                html += '<h4>🎨 Segmentation Masks</h4>';
                html += `<p>YOLO11m: ${results.yolo11m_masks} masks</p>`;
                html += `<p>Best.pt: ${results.best_pt_masks} masks</p>`;
                html += '</div>';
            }

            resultsContainer.innerHTML = html || '<p style="text-align: center; color: #999;">No detections yet</p>';
        }

        function startStatusUpdates() {
            statusInterval = setInterval(refreshStatus, 1000);
        }

        function stopStatusUpdates() {
            if (statusInterval) {
                clearInterval(statusInterval);
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        }

        // Initialize
        updateSystemStatus();
        refreshStatus();
    </script>
</body>
</html>
