<!-- Image Upload Component -->
<div class="container-xxl">
    <!-- Page Header -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="page-header modern-header">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <h1 class="page-title fw-bold mb-2">
                            <i class="fas fa-upload me-3"></i>Upload & Process Image
                        </h1>
                        <p class="page-subtitle text-muted mb-0">AI-powered image analysis with YOLO11 and SAM2</p>
                    </div>
                    <div class="page-actions">
                        <button class="btn btn-outline-secondary btn-modern" onclick="spaRouter.goBack()">
                            <i class="fas fa-arrow-left me-2"></i>Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Upload Interface -->
    <div class="row">
        <!-- Upload Section -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm animate-slide-in-right">
                <div class="card-header border-0 bg-transparent p-4">
                    <h5 class="card-title mb-0 fw-bold">
                        <i class="fas fa-cloud-upload-alt me-2"></i>Image Upload
                    </h5>
                </div>
                <div class="card-body p-4">
                    <!-- File Upload Area -->
                    <div class="upload-area" id="upload-area">
                        <div class="upload-content text-center">
                            <i class="fas fa-cloud-upload-alt fa-3x text-muted mb-3"></i>
                            <h5 class="text-muted">Drag & Drop Image Here</h5>
                            <p class="text-muted mb-3">or click to browse files</p>
                            <input type="file" id="image-upload" accept="image/*" style="display: none;">
                            <button class="btn btn-primary btn-modern" onclick="document.getElementById('image-upload').click()">
                                <i class="fas fa-folder-open me-2"></i>Choose File
                            </button>
                        </div>
                    </div>

                    <!-- Image Preview -->
                    <div class="image-preview mt-4" id="image-preview" style="display: none;">
                        <div class="preview-container">
                            <img id="preview-image" class="img-fluid rounded shadow" style="max-height: 400px;">
                            <div class="preview-overlay">
                                <button class="btn btn-sm btn-danger" onclick="removeImage()">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                        <div class="image-info mt-3">
                            <div class="row">
                                <div class="col-6">
                                    <small class="text-muted">File Size:</small>
                                    <div class="fw-bold" id="file-size">-</div>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted">Dimensions:</small>
                                    <div class="fw-bold" id="image-dimensions">-</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Processing Configuration -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm animate-slide-in-right" style="animation-delay: 0.2s;">
                <div class="card-header border-0 bg-transparent p-4">
                    <h5 class="card-title mb-0 fw-bold">
                        <i class="fas fa-cogs me-2"></i>Processing Configuration
                    </h5>
                </div>
                <div class="card-body p-4">
                    <!-- Processing Engine Selection -->
                    <div class="mb-4">
                        <label class="form-label fw-medium">
                            <i class="fas fa-server me-2"></i>Processing Engine
                        </label>
                        <select class="form-select" id="processing-engine">
                            <option value="cuda-vm102">NVIDIA CUDA VM102 (Docker GPU Passthrough)</option>
                            <option value="jetson-edge">Jetson Edge Computing</option>
                        </select>
                    </div>

                    <!-- AI Models Selection -->
                    <div class="mb-4">
                        <label class="form-label fw-medium">
                            <i class="fas fa-brain me-2"></i>AI Models
                        </label>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="enable-yolo" checked>
                            <label class="form-check-label" for="enable-yolo">
                                <i class="fas fa-eye me-2"></i>YOLO11 Object Detection
                            </label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="enable-sam2" checked>
                            <label class="form-check-label" for="enable-sam2">
                                <i class="fas fa-cut me-2"></i>SAM2 Segmentation
                            </label>
                        </div>
                    </div>

                    <!-- Jetson Configuration (conditional) -->
                    <div class="mb-4" id="jetson-config" style="display: none;">
                        <label class="form-label fw-medium">
                            <i class="fas fa-microchip me-2"></i>Jetson Device
                        </label>
                        <select class="form-select" id="jetson-device">
                            <option value="jetson-1">Jetson Orin 1</option>
                            <option value="jetson-2">Jetson Orin 2</option>
                            <option value="jetson-3">Jetson Orin 3</option>
                        </select>
                    </div>

                    <!-- Processing Options -->
                    <div class="mb-4">
                        <label class="form-label fw-medium">
                            <i class="fas fa-sliders-h me-2"></i>Processing Options
                        </label>
                        <div class="row">
                            <div class="col-6">
                                <label for="confidence-threshold" class="form-label">Confidence Threshold</label>
                                <input type="range" class="form-range" id="confidence-threshold" min="0" max="100" value="50">
                                <div class="text-center">
                                    <small class="text-muted" id="confidence-value">50%</small>
                                </div>
                            </div>
                            <div class="col-6">
                                <label for="max-detections" class="form-label">Max Detections</label>
                                <select class="form-select" id="max-detections">
                                    <option value="10">10</option>
                                    <option value="25" selected>25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Process Button -->
                    <div class="d-grid">
                        <button class="btn btn-primary btn-modern btn-lg" id="process-btn" disabled>
                            <i class="fas fa-magic me-2"></i>Process Image
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Processing Results -->
    <div class="row mt-4" id="results-section" style="display: none;">
        <div class="col-12">
            <div class="card border-0 shadow-sm animate-scale-in">
                <div class="card-header border-0 bg-transparent p-4">
                    <h5 class="card-title mb-0 fw-bold">
                        <i class="fas fa-chart-bar me-2"></i>Processing Results
                    </h5>
                </div>
                <div class="card-body p-4">
                    <div class="row">
                        <!-- Results Image -->
                        <div class="col-lg-8">
                            <div class="results-image-container">
                                <img id="results-image" class="img-fluid rounded shadow" style="max-height: 500px;">
                            </div>
                        </div>

                        <!-- Detection Summary -->
                        <div class="col-lg-4">
                            <div class="detection-summary">
                                <h6 class="fw-bold mb-3">Detection Summary</h6>
                                <div id="detection-stats">
                                    <!-- Detection statistics will be populated here -->
                                </div>
                                
                                <div class="mt-4">
                                    <h6 class="fw-bold mb-3">Detected Objects</h6>
                                    <div id="detected-objects">
                                        <!-- Detected objects list will be populated here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button class="btn btn-outline-primary" onclick="downloadResults()">
                            <i class="fas fa-download me-2"></i>Download Results
                        </button>
                        <button class="btn btn-outline-success" onclick="saveToDatabase()">
                            <i class="fas fa-save me-2"></i>Save to Database
                        </button>
                        <button class="btn btn-primary" onclick="processAnother()">
                            <i class="fas fa-redo me-2"></i>Process Another
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Image Upload Component Script
let uploadedFile = null;
let processingResults = null;

document.addEventListener('component-init', function(e) {
    if (e.target.id === 'image-upload') {
        initializeImageUpload(e.detail);
    }
});

function initializeImageUpload(data) {
    setupEventListeners();
    setupDragAndDrop();
}

function setupEventListeners() {
    // File input change
    document.getElementById('image-upload').addEventListener('change', handleFileSelect);
    
    // Processing engine change
    document.getElementById('processing-engine').addEventListener('change', handleEngineChange);
    
    // Confidence threshold change
    document.getElementById('confidence-threshold').addEventListener('input', updateConfidenceValue);
    
    // Process button click
    document.getElementById('process-btn').addEventListener('click', processImage);
}

function setupDragAndDrop() {
    const uploadArea = document.getElementById('upload-area');
    
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('drag-over');
    });
    
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('drag-over');
    });
    
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('drag-over');
        
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            handleFile(files[0]);
        }
    });
    
    uploadArea.addEventListener('click', () => {
        document.getElementById('image-upload').click();
    });
}

function handleFileSelect(e) {
    const file = e.target.files[0];
    if (file) {
        handleFile(file);
    }
}

function handleFile(file) {
    if (!file.type.startsWith('image/')) {
        showNotification('Please select a valid image file', 'error');
        return;
    }
    
    if (file.size > 10 * 1024 * 1024) { // 10MB limit
        showNotification('File size must be less than 10MB', 'error');
        return;
    }
    
    uploadedFile = file;
    
    // Show preview
    const reader = new FileReader();
    reader.onload = (e) => {
        const preview = document.getElementById('image-preview');
        const previewImg = document.getElementById('preview-image');
        
        previewImg.src = e.target.result;
        preview.style.display = 'block';
        
        // Update file info
        document.getElementById('file-size').textContent = formatFileSize(file.size);
        
        // Get image dimensions
        const img = new Image();
        img.onload = () => {
            document.getElementById('image-dimensions').textContent = `${img.width} × ${img.height}`;
        };
        img.src = e.target.result;
        
        // Enable process button
        document.getElementById('process-btn').disabled = false;
        
        showNotification('Image uploaded successfully!', 'success');
    };
    reader.readAsDataURL(file);
}

function removeImage() {
    uploadedFile = null;
    document.getElementById('image-preview').style.display = 'none';
    document.getElementById('process-btn').disabled = true;
    document.getElementById('results-section').style.display = 'none';
}

function handleEngineChange(e) {
    const jetsonConfig = document.getElementById('jetson-config');
    if (e.target.value === 'jetson-edge') {
        jetsonConfig.style.display = 'block';
    } else {
        jetsonConfig.style.display = 'none';
    }
}

function updateConfidenceValue(e) {
    document.getElementById('confidence-value').textContent = e.target.value + '%';
}

function processImage() {
    if (!uploadedFile) {
        showNotification('Please upload an image first', 'warning');
        return;
    }
    
    // Show processing state
    const processBtn = document.getElementById('process-btn');
    const originalText = processBtn.innerHTML;
    processBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Processing...';
    processBtn.disabled = true;
    
    // Get processing options
    const options = {
        engine: document.getElementById('processing-engine').value,
        enableYolo: document.getElementById('enable-yolo').checked,
        enableSam2: document.getElementById('enable-sam2').checked,
        confidenceThreshold: document.getElementById('confidence-threshold').value,
        maxDetections: document.getElementById('max-detections').value,
        jetsonDevice: document.getElementById('jetson-device').value
    };
    
    showNotification('Processing image with AI models...', 'info');
    
    // Simulate processing
    setTimeout(() => {
        // Mock processing results
        processingResults = {
            originalImage: document.getElementById('preview-image').src,
            processedImage: document.getElementById('preview-image').src, // In real app, this would be the processed image
            detections: [
                { class: 'bottle', confidence: 0.95, bbox: [100, 100, 200, 300] },
                { class: 'can', confidence: 0.87, bbox: [300, 150, 400, 350] },
                { class: 'plastic', confidence: 0.78, bbox: [500, 200, 600, 400] }
            ],
            processingTime: 2.3,
            engine: options.engine
        };
        
        displayResults(processingResults);
        
        // Reset button
        processBtn.innerHTML = originalText;
        processBtn.disabled = false;
        
        showNotification('Image processing completed!', 'success');
    }, 3000);
}

function displayResults(results) {
    // Show results section
    document.getElementById('results-section').style.display = 'block';
    
    // Update results image
    document.getElementById('results-image').src = results.processedImage;
    
    // Update detection stats
    const stats = document.getElementById('detection-stats');
    stats.innerHTML = `
        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Total Detections:</span>
            <span class="fw-bold">${results.detections.length}</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Processing Time:</span>
            <span class="fw-bold">${results.processingTime}s</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Engine Used:</span>
            <span class="fw-bold">${results.engine}</span>
        </div>
    `;
    
    // Update detected objects
    const objects = document.getElementById('detected-objects');
    objects.innerHTML = results.detections.map(detection => `
        <div class="detected-object mb-2 p-2 bg-light rounded">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span class="fw-bold text-capitalize">${detection.class}</span>
                </div>
                <div>
                    <span class="badge bg-success">${Math.round(detection.confidence * 100)}%</span>
                </div>
            </div>
        </div>
    `).join('');
}

function downloadResults() {
    if (!processingResults) {
        showNotification('No results to download', 'warning');
        return;
    }
    
    showNotification('Preparing download...', 'info');
    setTimeout(() => {
        showNotification('Results downloaded successfully!', 'success');
    }, 1000);
}

function saveToDatabase() {
    if (!processingResults) {
        showNotification('No results to save', 'warning');
        return;
    }
    
    showNotification('Saving results to database...', 'info');
    setTimeout(() => {
        showNotification('Results saved successfully!', 'success');
    }, 1500);
}

function processAnother() {
    removeImage();
    document.getElementById('results-section').style.display = 'none';
    processingResults = null;
}

function formatFileSize(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function showNotification(message, type = 'info') {
    if (window.spaRouter && window.spaRouter.showNotification) {
        window.spaRouter.showNotification(message, type);
    } else {
        console.log(`[${type.toUpperCase()}] ${message}`);
    }
}
</script>

<style>
.upload-area {
    border: 2px dashed #dee2e6;
    border-radius: 12px;
    padding: 3rem 2rem;
    text-align: center;
    transition: all 0.3s ease;
    cursor: pointer;
}

.upload-area:hover,
.upload-area.drag-over {
    border-color: #667eea;
    background-color: rgba(102, 126, 234, 0.05);
}

.upload-content {
    pointer-events: none;
}

.preview-container {
    position: relative;
    display: inline-block;
}

.preview-overlay {
    position: absolute;
    top: 10px;
    right: 10px;
}

.detected-object {
    transition: all 0.2s ease;
}

.detected-object:hover {
    transform: translateX(5px);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}
</style>
