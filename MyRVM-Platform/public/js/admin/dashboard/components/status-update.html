<!-- Status Update Component -->
<div class="container-xxl">
    <!-- Page Header -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="page-header modern-header">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <h1 class="page-title fw-bold mb-2">
                            <i class="fas fa-edit me-3"></i>Update RVM Status
                        </h1>
                        <p class="page-subtitle text-muted mb-0">Change operational status of RVM</p>
                    </div>
                    <div class="page-actions">
                        <button class="btn btn-outline-secondary btn-modern" onclick="spaRouter.goBack()">
                            <i class="fas fa-arrow-left me-2"></i>Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Update Form -->
    <div class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm animate-slide-in-right">
                <div class="card-header border-0 bg-transparent p-4">
                    <h5 class="card-title mb-0 fw-bold">
                        <i class="fas fa-cog me-2"></i>Status Configuration
                    </h5>
                </div>
                <div class="card-body p-4">
                    <!-- RVM Information -->
                    <div class="mb-4">
                        <div class="d-flex align-items-center mb-3">
                            <div class="status-dot active me-3" id="current-status-dot"></div>
                            <div>
                                <h6 class="mb-1 fw-bold" id="rvm-name-display">RVM-001</h6>
                                <small class="text-muted" id="rvm-location-display">Main Lobby - Building A</small>
                            </div>
                        </div>
                    </div>

                    <form id="status-update-form">
                        <!-- Current Status Display -->
                        <div class="mb-4">
                            <label class="form-label fw-medium">
                                <i class="fas fa-info-circle me-2"></i>Current Status
                            </label>
                            <div class="current-status-display p-3 bg-light rounded">
                                <div class="d-flex align-items-center">
                                    <div class="status-dot active me-3" id="display-status-dot"></div>
                                    <div>
                                        <span class="fw-bold" id="current-status-text">Active</span>
                                        <br>
                                        <small class="text-muted" id="status-description">RVM is operational and ready</small>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- New Status Selection -->
                        <div class="mb-4">
                            <label for="new-status" class="form-label fw-medium">
                                <i class="fas fa-arrow-right me-2"></i>New Status
                            </label>
                            <select id="new-status" class="form-select form-select-lg" required>
                                <option value="">Select new status...</option>
                                <option value="active">🟢 Active - RVM is operational and ready</option>
                                <option value="inactive">⚫ Inactive - RVM is offline or disabled</option>
                                <option value="maintenance">🟡 Maintenance - RVM is under maintenance</option>
                                <option value="full">🔴 Full - RVM storage is full</option>
                                <option value="error">❌ Error - RVM has encountered an error</option>
                                <option value="unknown">❓ Unknown - Status cannot be determined</option>
                            </select>
                        </div>

                        <!-- Status Change Reason -->
                        <div class="mb-4">
                            <label for="status-reason" class="form-label fw-medium">
                                <i class="fas fa-comment me-2"></i>Reason for Change
                            </label>
                            <textarea id="status-reason" class="form-control" rows="3" 
                                      placeholder="Please provide a reason for this status change..."></textarea>
                        </div>

                        <!-- Maintenance Details (if maintenance selected) -->
                        <div class="mb-4" id="maintenance-details" style="display: none;">
                            <label class="form-label fw-medium">
                                <i class="fas fa-tools me-2"></i>Maintenance Details
                            </label>
                            <div class="row">
                                <div class="col-md-6">
                                    <label for="maintenance-type" class="form-label">Maintenance Type</label>
                                    <select id="maintenance-type" class="form-select">
                                        <option value="scheduled">Scheduled Maintenance</option>
                                        <option value="emergency">Emergency Repair</option>
                                        <option value="upgrade">System Upgrade</option>
                                        <option value="cleaning">Cleaning Service</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="estimated-duration" class="form-label">Estimated Duration</label>
                                    <select id="estimated-duration" class="form-select">
                                        <option value="30">30 minutes</option>
                                        <option value="60">1 hour</option>
                                        <option value="120">2 hours</option>
                                        <option value="240">4 hours</option>
                                        <option value="480">8 hours</option>
                                        <option value="1440">24 hours</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Notification Settings -->
                        <div class="mb-4">
                            <label class="form-label fw-medium">
                                <i class="fas fa-bell me-2"></i>Notification Settings
                            </label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="notify-operators" checked>
                                <label class="form-check-label" for="notify-operators">
                                    Notify operators about this status change
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="notify-maintenance" checked>
                                <label class="form-check-label" for="notify-maintenance">
                                    Notify maintenance team (if applicable)
                                </label>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="button" class="btn btn-secondary btn-modern" onclick="spaRouter.goBack()">
                                <i class="fas fa-times me-2"></i>Cancel
                            </button>
                            <button type="submit" class="btn btn-primary btn-modern">
                                <i class="fas fa-save me-2"></i>Update Status
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <!-- Status History -->
            <div class="card border-0 shadow-sm animate-slide-in-right" style="animation-delay: 0.2s;">
                <div class="card-header border-0 bg-transparent p-4">
                    <h6 class="card-title mb-0 fw-bold">
                        <i class="fas fa-history me-2"></i>Status History
                    </h6>
                </div>
                <div class="card-body p-4">
                    <div class="status-timeline" id="status-timeline">
                        <!-- Status history items will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Impact Assessment -->
            <div class="card border-0 shadow-sm animate-slide-in-right mt-4" style="animation-delay: 0.4s;">
                <div class="card-header border-0 bg-transparent p-4">
                    <h6 class="card-title mb-0 fw-bold">
                        <i class="fas fa-chart-line me-2"></i>Impact Assessment
                    </h6>
                </div>
                <div class="card-body p-4">
                    <div class="impact-metrics">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Daily Transactions:</span>
                            <span class="fw-bold" id="daily-transactions">~150</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Revenue Impact:</span>
                            <span class="fw-bold text-warning" id="revenue-impact">~$45/day</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">User Impact:</span>
                            <span class="fw-bold text-info" id="user-impact">High</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Status Update Component Script
document.addEventListener('component-init', function(e) {
    if (e.target.id === 'status-update') {
        initializeStatusUpdate(e.detail);
    }
});

function initializeStatusUpdate(data) {
    // Update RVM information
    if (data.rvmId) {
        document.getElementById('rvm-name-display').textContent = `RVM-${data.rvmId}`;
        document.getElementById('rvm-location-display').textContent = data.location || 'Unknown Location';
    }

    // Setup form submission
    document.getElementById('status-update-form').addEventListener('submit', handleStatusUpdate);
    
    // Setup status change handler
    document.getElementById('new-status').addEventListener('change', handleStatusChange);
    
    // Load current status and history
    loadCurrentStatus(data.rvmId);
    loadStatusHistory(data.rvmId);
}

function handleStatusUpdate(e) {
    e.preventDefault();
    
    const newStatus = document.getElementById('new-status').value;
    const reason = document.getElementById('status-reason').value;
    const notifyOperators = document.getElementById('notify-operators').checked;
    const notifyMaintenance = document.getElementById('notify-maintenance').checked;
    
    if (!newStatus) {
        showNotification('Please select a new status', 'warning');
        return;
    }
    
    if (!reason.trim()) {
        showNotification('Please provide a reason for the status change', 'warning');
        return;
    }
    
    // Show updating state
    showNotification('Updating RVM status...', 'info');
    
    // Simulate status update
    setTimeout(() => {
        // Update the status
        updateRVMStatus(newStatus, reason);
        
        // Show success message
        showNotification('RVM status updated successfully!', 'success');
        
        // Redirect back to dashboard
        setTimeout(() => {
            spaRouter.navigate('/dashboard');
        }, 2000);
    }, 2000);
}

function handleStatusChange(e) {
    const newStatus = e.target.value;
    const maintenanceDetails = document.getElementById('maintenance-details');
    
    // Show/hide maintenance details based on status
    if (newStatus === 'maintenance') {
        maintenanceDetails.style.display = 'block';
    } else {
        maintenanceDetails.style.display = 'none';
    }
    
    // Update impact assessment
    updateImpactAssessment(newStatus);
}

function loadCurrentStatus(rvmId) {
    // Mock current status loading
    setTimeout(() => {
        const currentStatus = 'active';
        updateStatusDisplay(currentStatus);
    }, 500);
}

function loadStatusHistory(rvmId) {
    // Mock status history
    const history = [
        { status: 'active', timestamp: '2025-09-17 10:30:00', user: 'Admin User', reason: 'System restored' },
        { status: 'maintenance', timestamp: '2025-09-17 09:15:00', user: 'Maintenance Team', reason: 'Scheduled cleaning' },
        { status: 'active', timestamp: '2025-09-16 18:00:00', user: 'Admin User', reason: 'Maintenance completed' },
        { status: 'full', timestamp: '2025-09-16 15:45:00', user: 'System', reason: 'Storage capacity reached' }
    ];
    
    const timeline = document.getElementById('status-timeline');
    timeline.innerHTML = history.map(item => `
        <div class="status-history-item mb-3">
            <div class="d-flex align-items-start">
                <div class="status-dot ${item.status} me-3 mt-1"></div>
                <div class="flex-grow-1">
                    <div class="fw-bold text-capitalize">${item.status}</div>
                    <small class="text-muted">${item.timestamp}</small>
                    <div class="text-muted small">${item.reason}</div>
                    <small class="text-muted">by ${item.user}</small>
                </div>
            </div>
        </div>
    `).join('');
}

function updateStatusDisplay(status) {
    const statusDot = document.getElementById('current-status-dot');
    const displayDot = document.getElementById('display-status-dot');
    const statusText = document.getElementById('current-status-text');
    const description = document.getElementById('status-description');
    
    const statusInfo = {
        active: { text: 'Active', desc: 'RVM is operational and ready' },
        inactive: { text: 'Inactive', desc: 'RVM is offline or disabled' },
        maintenance: { text: 'Maintenance', desc: 'RVM is under maintenance' },
        full: { text: 'Full', desc: 'RVM storage is full' },
        error: { text: 'Error', desc: 'RVM has encountered an error' },
        unknown: { text: 'Unknown', desc: 'Status cannot be determined' }
    };
    
    const info = statusInfo[status] || statusInfo.unknown;
    
    // Update status dot
    statusDot.className = `status-dot ${status} me-3`;
    displayDot.className = `status-dot ${status} me-3`;
    
    // Update text
    statusText.textContent = info.text;
    description.textContent = info.desc;
}

function updateImpactAssessment(status) {
    const metrics = {
        active: { transactions: '~150', revenue: '$45/day', impact: 'Low' },
        inactive: { transactions: '0', revenue: '$0/day', impact: 'High' },
        maintenance: { transactions: '0', revenue: '$0/day', impact: 'High' },
        full: { transactions: '0', revenue: '$0/day', impact: 'High' },
        error: { transactions: '0', revenue: '$0/day', impact: 'High' },
        unknown: { transactions: '?', revenue: '?', impact: 'Unknown' }
    };
    
    const metric = metrics[status] || metrics.unknown;
    
    document.getElementById('daily-transactions').textContent = metric.transactions;
    document.getElementById('revenue-impact').textContent = metric.revenue;
    document.getElementById('user-impact').textContent = metric.impact;
    
    // Update impact color
    const impactElement = document.getElementById('user-impact');
    impactElement.className = `fw-bold ${
        metric.impact === 'High' ? 'text-danger' : 
        metric.impact === 'Medium' ? 'text-warning' : 'text-success'
    }`;
}

function updateRVMStatus(newStatus, reason) {
    // This would integrate with your backend API
    console.log('Updating RVM status:', { newStatus, reason });
    
    // Update local storage or trigger dashboard refresh
    if (window.monitoringData && window.monitoringData.rvms) {
        const rvmId = getCurrentRVMId();
        const rvm = window.monitoringData.rvms.find(r => r.id == rvmId);
        if (rvm) {
            rvm.calculated_status = newStatus;
            rvm.last_seen = new Date().toLocaleTimeString();
        }
    }
}

function getCurrentRVMId() {
    return window.location.pathname.split('/').pop();
}

function showNotification(message, type = 'info') {
    if (window.spaRouter && window.spaRouter.showNotification) {
        window.spaRouter.showNotification(message, type);
    } else {
        console.log(`[${type.toUpperCase()}] ${message}`);
    }
}
</script>
